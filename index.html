<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>브랜드검색 소재 미리보기</title>
<style>
  :root { --bg:#f3f4f1; --panel:#fff; --ink:#1d2320; --muted:#66706a; --line:#dfe3de; --accent:#1f6f5c; --warn:#b4441f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151917; --panel:#1d2220; --ink:#e8ece9; --muted:#9aa49e; --line:#2f3632; --accent:#6cc3a7; --warn:#f08a63; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px 24px; display:grid; gap:14px; }
  h1 { font-size:18px; margin:0; }
  p { margin:0; color:var(--muted); font-size:13px; line-height:1.5; }
  input { font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; width:100%; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-size:15px; padding:10px; border:0; border-radius:8px; background:var(--accent); color:var(--panel); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  label.keep { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); }
  label.keep input { width:auto; }
  .err { color:var(--warn); font-size:13px; min-height:1em; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>브랜드검색 소재 미리보기</h1>
  <p>비밀번호를 입력하면 들어갈 수 있어요.</p>
  <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" required autofocus>
  <label class="keep"><input id="keep" type="checkbox" checked> 이 브라우저에서 기억하기</label>
  <button id="go" type="submit">들어가기</button>
  <div class="err" id="err" role="alert"></div>
</form>

  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  go.disabled = true; go.textContent = '확인 중…'; err.textContent = '';
  try {
    const html = await open(pw);
    try { document.getElementById('keep').checked ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch (_) {}
    show(html);
  } catch (_) {
    err.textContent = '비밀번호가 맞지 않아요.';
    go.disabled = false; go.textContent = '들어가기';
  }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (!saved) return;
  try { show(await open(saved)); } catch (_) { try { localStorage.removeItem(KEY); } catch (__) {} }
})();
</script>
